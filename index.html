<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一本收集 &TEAM 真實語錄的解答之書。">
  <title>オオカミのお悩み相談所</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 36px 18px;
      background: #eee5d6;
      color: #594b3b;
      font-family: Georgia, "Noto Serif TC", serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      width: 100%;
      max-width: 540px;
      padding: 38px 28px;
      background: #fbf7ee;
      border: 1px solid #d8c9b2;
      border-radius: 5px;
      box-shadow: 0 12px 35px #77654b20;
      text-align: center;
    }

    .ornament {
      color: #aa9271;
      letter-spacing: 7px;
      font-size: 13px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(27px, 7vw, 38px);
      font-weight: normal;
      letter-spacing: 2px;
      margin: 0 0 12px;
    }

    .subtitle {
      color: #98856c;
      font-size: 13px;
      line-height: 1.9;
      margin-bottom: 30px;
    }

    .book-cover {
      width: 100%;
      max-width: 310px;
      height: 175px;
      margin: 0 auto 30px;
      background: linear-gradient(135deg, #a48b6c, #78634d);
      border: 5px double #d9c7a8;
      border-radius: 4px 12px 12px 4px;
      box-shadow: 5px 7px 12px #51412d30;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff6e6;
    }

    .book-cover span:first-child {
      font-size: 13px;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .book-cover strong {
      font-size: 25px;
      font-weight: normal;
      letter-spacing: 3px;
    }

    .book-cover span:last-child {
      margin-top: 15px;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .question-label {
      display: block;
      text-align: left;
      font-size: 14px;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 115px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #d9cbb7;
      border-radius: 5px;
      background: #fffdf8;
      color: #594b3b;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.7;
      outline: none;
    }

    textarea:focus {
      border-color: #a48b6c;
    }

    textarea::placeholder {
      color: #b8aa96;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: none;
      border-radius: 4px;
      background: #806b50;
      color: #fffaf0;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 2px;
      cursor: pointer;
    }

    button:hover {
      background: #68543d;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .privacy {
      margin-top: 14px;
      color: #a79780;
      font-size: 11px;
      line-height: 1.8;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .result-card {
      margin-top: 12px;
      padding: 35px 20px;
      border: 1px solid #dfd1bd;
      background: #fffdf8;
      border-radius: 5px;
    }

    .result-label {
      color: #a48b6c;
      font-size: 11px;
      letter-spacing: 3px;
    }

    .member {
      margin: 20px 0 26px;
      font-size: 25px;
      letter-spacing: 4px;
    }

    .original {
      font-size: 21px;
      line-height: 1.9;
      margin: 20px 0;
      overflow-wrap: anywhere;
    }

    .translation {
      font-size: 15px;
      line-height: 2;
      color: #8e7b63;
      margin-top: 20px;
      overflow-wrap: anywhere;
    }

    .source {
      margin-top: 25px;
      color: #b3a38c;
      font-size: 11px;
      line-height: 1.8;
    }

    .back-button {
      background: transparent;
      border: 1px solid #b8a58a;
      color: #806b50;
    }

    .back-button:hover {
      color: white;
    }

    .message {
      color: #8e7b63;
      font-size: 14px;
      line-height: 1.9;
      margin: 20px 0;
    }

    footer {
      margin-top: 30px;
      color: #b3a38c;
      font-size: 11px;
      letter-spacing: 1px;
    }

    @media (max-width: 420px) {
      .page {
        padding: 30px 19px;
      }

      .book-cover {
        height: 150px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- 第一頁：輸入煩惱 -->
    <section id="inputScreen" class="screen active">

      <div class="ornament">✦ ───── ✦</div>

      <h1>The Book of &TEAM</h1>

      <div class="subtitle">
        有煩惱的話就交給狼管家<br>
        讓他幫你翻翻解答之書
			</div>

      <div class="book-cover">
        <span>A LITTLE BOOK</span>
        <strong>&TEAM</strong>
        <span>FOR YOU ♡</span>
      </div>

      <label class="question-label" for="question">
        請在心裡默念想問的問題
      </label>

      <textarea
        id="question"
        placeholder="或是這裡寫下你的煩惱……"
      ></textarea>

      <button id="drawButton" type="button">
        ✦ 占卜 ✦
      </button>

      <div class="privacy">
        ＊煩惱只會留在這個畫面，後台也看不見＊
      </div>

    </section>


    <!-- 第二頁：顯示抽出的語錄 -->
    <section id="resultScreen" class="screen">

      <div class="ornament">✦ ───── ✦</div>

      <div class="result-label">YOUR MESSAGE</div>

      <div class="result-card">

        <div class="member" id="member"></div>

        <div class="original" id="original"></div>

        <div class="translation" id="translation"></div>

        <div class="source" id="source"></div>

      </div>

      <button id="againButton" type="button">
        ✦ 再抽一次 ✦
      </button>

      <button id="backButton" class="back-button" type="button">
        回到首頁
      </button>

    </section>

    <footer>
      4th anniversary
    </footer>

  </main>


  <!-- 載入語錄資料 -->
  <script src="quotes.js"></script>

  <script>
    const inputScreen = document.getElementById("inputScreen");
    const resultScreen = document.getElementById("resultScreen");

    const question = document.getElementById("question");

    const drawButton = document.getElementById("drawButton");
    const againButton = document.getElementById("againButton");
    const backButton = document.getElementById("backButton");

    let drawing = false;

    // 切換畫面
    function showScreen(screen) {
      inputScreen.classList.remove("active");
      resultScreen.classList.remove("active");

      screen.classList.add("active");

      window.scrollTo({
        top: 0,
        behavior: "auto"
      });
    }

    // 抽取語錄
    function drawQuote() {
      if (drawing) return;

      const quotes = Array.isArray(window.quotes)
        ? window.quotes
        : [];

      // 清空輸入內容，不保存煩惱
      question.value = "";

      const validQuotes = quotes.filter(quote =>
        quote &&
        typeof quote.member === "string" &&
        typeof quote.original === "string" &&
        typeof quote.translation === "string" &&
        quote.member.trim() !== "" &&
        quote.original.trim() !== "" &&
        quote.translation.trim() !== ""
      );

      const member = document.getElementById("member");
      const original = document.getElementById("original");
      const translation = document.getElementById("translation");
      const source = document.getElementById("source");

      // 沒有語錄或資料格式錯誤
      if (validQuotes.length === 0) {
        member.textContent = "";
        original.textContent = "目前沒有可抽取的語錄。";
        translation.textContent =
          "請確認 quotes.js 是否已經正確加入語錄。";
        source.textContent = "";

        showScreen(resultScreen);
        return;
      }

      drawing = true;
      drawButton.disabled = true;
      againButton.disabled = true;

      // 隨機抽取一筆
      const randomIndex = Math.floor(
        Math.random() * validQuotes.length
      );

      const quote = validQuotes[randomIndex];

      member.textContent = quote.member;
      original.textContent = "「" + quote.original + "」";
      translation.textContent = quote.translation;

      // 出處只在資料存在時顯示
      source.textContent = quote.source
        ? "Source: " + quote.source
        : "";

      // 直接切換到第二頁，沒有翻頁動畫
      showScreen(resultScreen);

      drawing = false;
      drawButton.disabled = false;
      againButton.disabled = false;
    }

    drawButton.addEventListener("click", drawQuote);

    // 再抽一次：直接在第二頁抽新語錄
    againButton.addEventListener("click", drawQuote);

    // 返回第一頁
    backButton.addEventListener("click", () => {
      question.value = "";
      showScreen(inputScreen);
    });
  </script>

</body>
</html>
